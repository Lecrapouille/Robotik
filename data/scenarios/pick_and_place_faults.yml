scenario: pick_and_place_faults
seed: 7

# Same mission with camera failures. A failure is only an unavailable
# resource: Detect fails until the camera is repaired (the tree retries it),
# then the camera fails for good and the robot goes on from its world model.
robot:
  model: ../robot_6axis.urdf
  home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
  sensors:
    wrist_camera:
      type: camera
      parent: link6
      position: [0.05, 0.0, 0.0]
      fov: 70
      resolution: [320, 240]
      frequency: 15
  actuators:
    arm: { type: joint_group }
    gripper: { type: vacuum, length: 0.06 }

world:
  objects:
    red_cube:
      type: cube
      size: [0.04, 0.04, 0.04]
      color: [0.9, 0.1, 0.1]
      position: [0.40, 0.20, 0.02]
      randomize: { x: [-0.02, 0.02], y: [-0.02, 0.02] }
    box:
      type: box
      size: [0.16, 0.16, 0.08]
      color: [0.2, 0.4, 0.9]
      position: [0.40, -0.20, 0.04]

faults:
  - { at: 0.0, resource: wrist_camera, action: disable }
  - { at: 1.0, resource: wrist_camera, action: restore }
  - { at: 3.0, resource: wrist_camera, action: disable }
  # Random failures: mean rate per second.
  # - { resource: gripper, rate: 0.01 }

execute:
  task: |
    Pick the red cube and put it in the box, with a camera failure.
  behavior_tree: pick_and_place.bt.yml

assert:
  - robot.success
  - object("red_cube").inside("box")
  - gripper.empty
  - collisions == 0
  - time < 30
