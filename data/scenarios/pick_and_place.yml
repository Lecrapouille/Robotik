scenario: pick_and_place

world:
  robot:
    model: ../robot_6axis.urdf
    # Joint positions in radians. The tool points down.
    home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
    # Suction cup length along the flange Z axis, in meters.
    tool_length: 0.06
    # Wrist camera, looking along the flange Z axis.
    camera:
      link: link6
      position: [0.05, 0.0, 0.0]
      fov: 70
      resolution: [320, 240]

  # Positions are object centers in the robot base frame, meters.
  objects:
    - name: red_cube
      type: cube
      size: [0.04, 0.04, 0.04]
      color: [0.9, 0.1, 0.1]
      position: [0.40, 0.20, 0.02]

    - name: box
      type: box
      size: [0.16, 0.16, 0.08]
      color: [0.2, 0.4, 0.9]
      position: [0.40, -0.20, 0.04]

execute:
  task: |
    Pick the red cube and put it in the box.
  behavior_tree: pick_and_place.bt.yml

assert:
  - robot.success
  - object("red_cube").inside("box")
  - gripper.empty
  - collisions == 0
