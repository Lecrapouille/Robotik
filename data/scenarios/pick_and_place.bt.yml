# Actions are the skills of the simulation, run by the skill scheduler. Per
# object: Detect(o), Approach(o) (10 cm above), Reach(o) (touching its top),
# Grasp(o). Robot wide: Home, Release, Stop (emergency stop, highest priority).

BehaviorTree:
  Sequence:
    name: PickAndPlace
    children:
      - Action:
          name: Home
      - Sequence:
          name: Pick
          children:
            # A failed camera makes Detect fail at once (resource
            # unavailable): try again until it is back.
            - UntilSuccess:
                attempts: 1000
                child:
                  - Action:
                      name: Detect(red_cube)
            - Action:
                name: Approach(red_cube)
            - Action:
                name: Reach(red_cube)
            - Action:
                name: Grasp(red_cube)
            - Action:
                name: Approach(red_cube)
      - Sequence:
          name: Place
          children:
            - Action:
                name: Approach(box)
            - Action:
                name: Release
      - Action:
          name: Home
