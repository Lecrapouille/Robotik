scenario:
  id: pick_and_place
  description: Pick the red cube and put it in the box.
  world: ../worlds/pick_place_cell.yaml
  # Master seed: prop layout, sensor noise and random faults derive from it.
  seed: 42

  controller:
    behavior_tree: pick_and_place.bt.yml

  timeout: 60

  assertions:
    - controller.success
    - inside(red_cube, box)
    - holding(gripper) == 0
    - { condition: "collision_count(robot) == 0", phase: always }
    - time < 30
