plugin:
  id: robotik.pick_and_place_rl
  name: Pick and place RL
  version: 1.0.0
  api_version: 1
  category: Learning

library:
  entrypoint: librobotik_pick_and_place_rl.so

resources:
  packs:
    - { id: robotik.robots, version: "1.0" }
    - { id: robotik.tools, version: "1.0" }

# The plugin update advances the simulation itself.
host:
  clock: plugin

scenarios:
  directory: scenarios
  entries:
    - { id: pick_and_place_rl, name: Pick and place RL, file: pick_and_place_rl.yml }
