plugin:
  id: robotik.fly
  name: Fly
  version: 1.0.0
  api_version: 1
  category: Perception

library:
  entrypoint: librobotik_fly.so

resources:
  packs:
    - { id: robotik.fly, version: "1.0" }

host:
  view:
    eye: [4.0, 5.5, 7.0]
    target: [4.0, 1.2, 0.0]

scenarios:
  directory: scenarios
  entries:
    - { id: fly_obstacle_avoidance, name: Fly brain, file: fly_obstacle_avoidance.yml }
