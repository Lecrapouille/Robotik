# Reach the food while skirting the blocks.
scenario:
  id: fly_obstacle_avoidance
  description: Reach the food while skirting the blocks.
  world: worlds/fly_arena.world.yaml
  seed: 123456
  timeout: 40

  parameters:
    brain: shiu            # shiu (13 neurons, or the FlyWire connectome) | reflex
    dt: 0.01               # fly model step, equal to the host step
    sensor_noise: 0.01     # gaussian noise on each eye
    layout_jitter: 0.02    # uniform shift of each block per episode (m)
    arena: [10.0, 10.0, 5.0]

  assertions:
    - fly.reached
    - time < 40
