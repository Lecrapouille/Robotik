# A fly in a 10 m arena (the x100 model: about 28 cm, 1 kg; the real fly is
# a hundred times smaller), two blocks to skirt and food to reach. The
# brain sees three synthetic eye rays; the two cameras only show the view
# from the eyes. Z-up, metres, radians.
world:
  id: fly_arena
  entities:
    - id: fly
      type: robot
      model: robotik.fly.drosophila_x100
      pose: { position: [0.5, 0.0, 1.0] }
      sensors:
        # Optical z along the eye link +X, image x to the link -Y.
        eye_left: { type: camera, parent: eye_L, position: [0.04, 0.0, 0.0],
                    rpy: [-1.5707963267948966, 0.0, -1.5707963267948966],
                    fov: 70, resolution: [160, 120], frequency: 10 }
        eye_right: { type: camera, parent: eye_R, position: [0.04, 0.0, 0.0],
                     rpy: [-1.5707963267948966, 0.0, -1.5707963267948966],
                     fov: 70, resolution: [160, 120], frequency: 10 }

    - id: obstacle_1
      type: prop
      shape: { type: box, size: [1.0, 1.3, 2.0] }
      color: [0.45, 0.32, 0.18]
      pose: { position: [3.2, 0.40, 1.0] }
    - id: obstacle_2
      type: prop
      shape: { type: box, size: [0.8, 1.1, 3.0] }
      color: [0.45, 0.32, 0.18]
      pose: { position: [5.7, -0.45, 1.0] }

    - id: food
      type: prop
      shape: { type: box, size: [0.36, 0.36, 0.36] }
      color: [0.95, 0.75, 0.15]
      pose: { position: [8.0, -1.5, 1.75] }
