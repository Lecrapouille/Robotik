# The factory of factory_cell.world.yaml with a defect: p2b is 6 mm too
# thin (a chipped part). M1 measures each part after machining it
# (defective(part), from its believed size) and drops the bad ones in the
# scrap bin; M2 and the outfeed skip them.
world:
  id: factory_reject_cell

  entities:
    - id: M1
      type: robot
      kind: arm
      model: robotik.robots.robot_6axis
      pose: { position: [0.0, -0.25, 0.0] }
      home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
      actuators:
        M1_arm: { type: joint_group }
    - id: M1_cup
      type: tool
      model: robotik.tools.vacuum
      attach: { parent: M1.flange, frame: tool_mount }
      actuators:
        M1_gripper: { type: vacuum }

    - id: M2
      type: robot
      kind: arm
      model: robotik.robots.robot_6axis
      pose: { position: [0.0, 0.25, 0.0] }
      home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
      actuators:
        M2_arm: { type: joint_group }
    - id: M2_cup
      type: tool
      model: robotik.tools.vacuum
      attach: { parent: M2.flange, frame: tool_mount }
      actuators:
        M2_gripper: { type: vacuum }

    # Stock of M1: lot a in front, lot b behind.
    - { id: p1a, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.9, 0.1, 0.1], pose: { position: [0.15, -0.50, 0.02] } }
    - { id: p2a, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.1, 0.75, 0.2], pose: { position: [0.25, -0.50, 0.02] } }
    - { id: p3a, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.1, 0.3, 0.9], pose: { position: [0.35, -0.50, 0.02] } }
    - { id: p1b, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.9, 0.1, 0.1], pose: { position: [0.15, -0.60, 0.02] } }
    - { id: p2b, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.034] }, color: [0.1, 0.75, 0.2], pose: { position: [0.25, -0.60, 0.017] } }   # chipped: 6 mm too thin
    - { id: p3b, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.1, 0.3, 0.9], pose: { position: [0.35, -0.60, 0.02] } }

    # The station between the two machines: one place per kind of part,
    # station_1 .. station_3 along x, 11 cm apart.
    - id: station
      type: buffer
      kind: bin
      places: 3
      size: [0.10, 0.10, 0.01]
      pitch: 0.11
      colors: [[0.9, 0.6, 0.6], [0.6, 0.9, 0.6], [0.6, 0.6, 0.9]]
      pose: { position: [0.36, 0.0, 0.005] }

    # The outfeed of M2: 60 cm along x (entry at x = 0.09); each part goes
    # one pitch (12 cm) away, the first ones wait against outfeed_stop.
    # 80 cm (60 in factory_cell), the same entry: the five good parts stay
    # apart, none pressed against another one by the belt.
    - id: outfeed
      type: conveyor
      size: [0.80, 0.10, 0.04]
      pose: { position: [0.45, 0.55, 0.02] }
      speed: 0.3
      direction: [1, 0, 0]
      stop: true

    # The scrap bin of M1: the parts the inspection rejects.
    - id: scrap
      type: prop
      kind: bin
      shape: { type: container, size: [0.16, 0.16, 0.08] }
      color: [0.35, 0.35, 0.35]
      pose: { position: [-0.05, -0.60, 0.04] }
