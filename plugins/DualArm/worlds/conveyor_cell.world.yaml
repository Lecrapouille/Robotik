# Two 6-axis arms side by side, each with a vacuum cup and a wrist camera.
# A conveyor brings the parts from a feeder, far in front of both arms, to
# two pick zones, one per arm; each arm drops its parts in its own bin.
# Z-up, metres, radians. Seen from above:
#
#            bin_left (0.05, -0.75)            bin_right (0.05, 0.75)
#   left (0, -0.35)   zone_left (0.40, -0.20)   zone_right (0.40, 0.20)   right (0, 0.35)
#                           feeder (0.92, 0): p1 p2 p3 p4
world:
  id: conveyor_cell

  entities:
    - id: left
      type: robot
      kind: arm                 # an object of the PDDL planner too
      model: robotik.robots.robot_6axis
      pose: { position: [0.0, -0.35, 0.0] }
      # The tool points down.
      home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
      sensors:
        left_camera:
          type: camera
          parent: link6
          position: [0.05, 0.0, 0.0]
          fov: 70
          resolution: [320, 240]
          frequency: 15
      actuators:
        left_arm: { type: joint_group }
    - id: left_cup
      type: tool
      model: robotik.tools.vacuum
      attach: { parent: left.flange, frame: tool_mount }
      actuators:
        left_gripper: { type: vacuum }

    - id: right
      type: robot
      kind: arm
      model: robotik.robots.robot_6axis
      pose: { position: [0.0, 0.35, 0.0] }
      home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
      sensors:
        right_camera:
          type: camera
          parent: link6
          position: [0.05, 0.0, 0.0]
          fov: 70
          resolution: [320, 240]
          frequency: 15
      actuators:
        right_arm: { type: joint_group }
    - id: right_cup
      type: tool
      model: robotik.tools.vacuum
      attach: { parent: right.flange, frame: tool_mount }
      actuators:
        right_gripper: { type: vacuum }

    # Places on the belt: flat open trays the parts rest in.
    - id: feeder
      type: prop
      kind: feeder
      shape: { type: container, size: [0.34, 0.10, 0.01] }
      color: [0.25, 0.25, 0.25]
      pose: { position: [0.92, 0.0, 0.005] }
    - id: zone_left
      type: prop
      kind: zone
      shape: { type: container, size: [0.12, 0.12, 0.01] }
      color: [0.35, 0.35, 0.35]
      pose: { position: [0.40, -0.20, 0.005] }
    - id: zone_right
      type: prop
      kind: zone
      shape: { type: container, size: [0.12, 0.12, 0.01] }
      color: [0.35, 0.35, 0.35]
      pose: { position: [0.40, 0.20, 0.005] }

    # Parts waiting on the feeder, out of reach of both arms. They rest on
    # the floor of the tray (5 mm).
    - id: p1
      type: prop
      kind: part
      shape: { type: box, size: [0.04, 0.04, 0.04] }
      color: [0.9, 0.1, 0.1]
      pose: { position: [0.80, 0.0, 0.025] }
    - id: p2
      type: prop
      kind: part
      shape: { type: box, size: [0.04, 0.04, 0.04] }
      color: [0.1, 0.3, 0.9]
      pose: { position: [0.88, 0.0, 0.025] }
    - id: p3
      type: prop
      kind: part
      shape: { type: box, size: [0.04, 0.04, 0.04] }
      color: [0.9, 0.1, 0.1]
      pose: { position: [0.96, 0.0, 0.025] }
    - id: p4
      type: prop
      kind: part
      shape: { type: box, size: [0.04, 0.04, 0.04] }
      color: [0.1, 0.3, 0.9]
      pose: { position: [1.04, 0.0, 0.025] }

    - id: bin_left
      type: prop
      kind: bin
      shape: { type: container, size: [0.16, 0.16, 0.08] }
      color: [0.9, 0.5, 0.5]
      pose: { position: [0.05, -0.75, 0.04] }
    - id: bin_right
      type: prop
      kind: bin
      shape: { type: container, size: [0.16, 0.16, 0.08] }
      color: [0.5, 0.6, 0.95]
      pose: { position: [0.05, 0.75, 0.04] }
