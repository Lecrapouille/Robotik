# Two machines one metre apart, a conveyor belt between them: the factory of
# factory_belt_cell.world.yaml where the station is a transfer belt. The
# feeder brings each part to M1; M1 machines it while holding it and puts it
# at the entry of the transfer belt; the belt carries it to its end, where a
# stop holds it; M2 takes it there, machines it and puts it on the outfeed
# belt, which takes it away. The parts weigh 50 g (rigid physics).
# Machining times (s), as in simple.flowshop:  P1  P2  P3
#                                          M1   2   3   1
#                                          M2   1   2   1.5
world:
  id: factory_transfer_cell

  entities:
    - id: M1
      type: robot
      kind: arm
      model: robotik.robots.robot_6axis
      pose: { position: [0.0, -0.25, 0.0] }
      home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
      actuators:
        M1_arm: { type: joint_group }
    - id: M1_cup
      type: tool
      model: robotik.tools.vacuum
      attach: { parent: M1.flange, frame: tool_mount }
      actuators:
        M1_gripper: { type: vacuum }

    - id: M2
      type: robot
      kind: arm
      model: robotik.robots.robot_6axis
      pose: { position: [0.0, 0.75, 0.0] }
      home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
      actuators:
        M2_arm: { type: joint_group }
    - id: M2_cup
      type: tool
      model: robotik.tools.vacuum
      attach: { parent: M2.flange, frame: tool_mount }
      actuators:
        M2_gripper: { type: vacuum }

    # The feeder: a belt of 70 cm along x, 4 cm high; the parts go to -x and
    # stop at its end (x = 0.20), the pick place of M1, against feeder_stop.
    - id: feeder
      type: conveyor
      size: [0.70, 0.10, 0.04]
      pose: { position: [0.55, -0.55, 0.02] }
      speed: 0.2
      direction: [-1, 0, 0]
      stop: true

    # The transfer belt: 60 cm along y, from M1 (entry at y = -0.06) to M2
    # (end at y = 0.50, against transfer_stop).
    - id: transfer
      type: conveyor
      size: [0.10, 0.60, 0.04]
      pose: { position: [0.30, 0.20, 0.02] }
      speed: 0.3
      direction: [0, 1, 0]
      stop: true

    # The parts on the feeder, in the order M1 takes them.
    - { id: p1a, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.9, 0.1, 0.1], pose: { position: [0.32, -0.55, 0.06] } }
    - { id: p2a, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.1, 0.75, 0.2], pose: { position: [0.42, -0.55, 0.06] } }
    - { id: p3a, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.1, 0.3, 0.9], pose: { position: [0.52, -0.55, 0.06] } }
    - { id: p1b, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.9, 0.1, 0.1], pose: { position: [0.62, -0.55, 0.06] } }
    - { id: p2b, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.1, 0.75, 0.2], pose: { position: [0.72, -0.55, 0.06] } }
    - { id: p3b, type: prop, kind: part, mass: 0.05, shape: { type: box, size: [0.04, 0.04, 0.04] }, color: [0.1, 0.3, 0.9], pose: { position: [0.82, -0.55, 0.06] } }

    # The outfeed: 60 cm along x, behind M2 (entry at x = 0.09); each part
    # goes one pitch (12 cm) away, the first ones wait against outfeed_stop.
    - id: outfeed
      type: conveyor
      size: [0.60, 0.10, 0.04]
      pose: { position: [0.35, 1.05, 0.02] }
      speed: 0.3
      direction: [1, 0, 0]
      stop: true
