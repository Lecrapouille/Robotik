# A small factory driven by a GRAFCET: the flowshop of TimedPetriNetEditor
# (data/examples/simple.flowshop) with two arms as the machines M1 and M2,
# three kinds of parts and two lots (worlds/factory_cell.world.yaml).
#
# The GRAFCET is generated from scenarios/factory.workflow.yaml: one sequence
# of steps per operation (machine, part) made of the recipes of the arms;
# AND convergences give the order of each machine and of each part (a part
# goes to M2 once machined by M1; the place of a kind in the station is free
# again once M2 took the part). Machining is a time receptivity (2s/X10)
# while the arm holds the part. The station is a zone: one arm at a time,
# M2 first. The same file gives the cycle time of the flowshop.
scenario:
  id: factory
  description: Two machines, three kinds of parts, two lots - the flowshop of simple.flowshop with robots.
  world: worlds/factory_cell.world.yaml
  seed: 42

  controller:
    grafcet:
      workflow: scenarios/factory.workflow.yaml   # ends at its End step

  perception: { fidelity: truth }   # the simulator gives the poses

  timeout: 240

  assertions:
    - controller.success
    - inside(p1a, output)
    - inside(p2a, output)
    - inside(p3a, output)
    - inside(p1b, output)
    - inside(p2b, output)
    - inside(p3b, output)
    - { condition: "collision_count(M1) == 0", phase: always }
    - { condition: "collision_count(M2) == 0", phase: always }
    # The machines work at the same time for a while.
    - dual_arm.overlap > 8
    - time < 70
