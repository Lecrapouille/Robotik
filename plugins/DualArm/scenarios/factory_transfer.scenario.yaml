# Two machines one metre apart, linked by a conveyor belt
# (worlds/factory_transfer_cell.world.yaml): the GRAFCET generated from
# scenarios/factory_transfer.workflow.yaml runs the feeder for each part, M1
# machines it and puts it at the entry of the transfer belt, the belt
# carries it to M2 (skill transfer_belt.Run), M2 machines it and puts it on
# the outfeed belt. The belt replaces the station of factory: a cheap device
# in place of a shared zone, the arms never meet. The stops hold the parts
# at the end of the belts with every physics:
# experiments/factory_rigid.experiment.yaml runs it also at rigid.
scenario:
  id: factory_transfer
  description: Two machines linked by a transfer belt - the belt carries each part from M1 to M2.
  world: worlds/factory_transfer_cell.world.yaml
  seed: 42

  controller:
    grafcet:
      workflow: scenarios/factory_transfer.workflow.yaml   # ends at its End step

  perception: { fidelity: truth }   # the simulator gives the poses

  timeout: 240

  assertions:
    - controller.success
    - on(p1a, outfeed)
    - on(p2a, outfeed)
    - on(p3a, outfeed)
    - on(p1b, outfeed)
    - on(p2b, outfeed)
    - on(p3b, outfeed)
    - { condition: "collision_count(M1) == 0", phase: always }
    - { condition: "collision_count(M2) == 0", phase: always }
    - skill_succeeded(M1.Over(transfer))
    - time < 90
