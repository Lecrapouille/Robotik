# The same cell as conveyor.scenario.yaml, with no search: the behavior tree
# grows backwards from the goal (PA-BT). It reaches the goal conditions one
# after the other, so one arm or the conveyor moves at a time, as in
# conveyor_sequential.scenario.yaml.
scenario:
  id: conveyor_pabt
  description: Sort the parts with a reactive tree grown from the goal, one step at a time.
  world: worlds/conveyor_cell.world.yaml
  seed: 42

  controller:
    planner:
      domain: scenarios/conveyor.domain.pddl
      method: pabt
      facts:
        - reaches(left, zone_left)
        - reaches(right, zone_right)
        - near(left, bin_left)
        - near(right, bin_right)
      goal:
        - at(p1, bin_left)
        - at(p2, bin_right)
        - at(p3, bin_left)
        - at(p4, bin_right)

  # The parts are found by their true pose (no color detector in this
  # plugin); the wrist cameras still render in the simulator.
  perception: { fidelity: truth }   # the simulator gives the poses

  timeout: 120

  assertions:
    - controller.success
    - inside(p1, bin_left)
    - inside(p2, bin_right)
    - inside(p3, bin_left)
    - inside(p4, bin_right)
    - { condition: "collision_count(left) == 0", phase: always }
    - { condition: "collision_count(right) == 0", phase: always }
    - planner.replans == 0
    # Never two arms at once.
    - dual_arm.overlap == 0
