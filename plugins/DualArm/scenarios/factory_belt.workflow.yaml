# The factory of factory.workflow.yaml fed by a conveyor belt
# (worlds/factory_belt_cell.world.yaml). The feeder is the first operator:
# its operation runs the belt 0.55 s (a pitch of 10 cm at 0.2 m/s, a little
# more: the stop at the end holds the part), when the pick place is free.
# M1 takes the part there; then as in factory.workflow.yaml.
#   ./build/Robotik-Headless build/plugins/DualArm/scenarios/factory_belt.workflow.yaml
workflow:
  id: factory_belt_line
  operators:
    - id: feeder
      entity: feeder
    - id: M1
      entity: M1
      take: [ "M1.Hover({part})", "M1.Reach({part})",
              "M1.Grasp({part}) . holding(M1, {part})", "M1.Hover({part})" ]
      give: [ "M1.Over({to})", "M1.Release", "M1.Home" ]
    - id: M2
      entity: M2
      take: [ "M2.Hover({part})", "M2.Reach({part})",
              "M2.Grasp({part}) . holding(M2, {part})", "M2.Hover({part})",
              "M2.Over({to})" ]
      give: [ "M2.Release" ]
  buffers:
    - { id: pick, after: feeder, place: pick }   # the end of the belt, one part
    - { id: station, after: M1, places: { P1: slot1, P2: slot2, P3: slot3 }, zone: true }
  output: output
  products:
    - id: P1
      parts: [p1a, p1b]
      route:
        - { name: bring, on: feeder, skill: feeder_belt.Run, duration: 0.55 }
        - { name: machining, on: M1, duration: 2.0 }
        - { name: machining, on: M2, duration: 1.0 }
    - id: P2
      parts: [p2a, p2b]
      route:
        - { name: bring, on: feeder, skill: feeder_belt.Run, duration: 0.55 }
        - { name: machining, on: M1, duration: 3.0 }
        - { name: machining, on: M2, duration: 2.0 }
    - id: P3
      parts: [p3a, p3b]
      route:
        - { name: bring, on: feeder, skill: feeder_belt.Run, duration: 0.55 }
        - { name: machining, on: M1, duration: 1.0 }
        - { name: machining, on: M2, duration: 1.5 }
