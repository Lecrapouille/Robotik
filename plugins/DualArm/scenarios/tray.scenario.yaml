# The left arm carries a tray of glasses from pad_a to pad_b; the right arm
# brings its tool above each glass while the tray moves. A temporal PDDL
# domain: the planner puts the visits during the carry, and the executor
# keeps the tray moving (and held) until the last visit ends. The tray and
# the glasses are rigid bodies: they would slide or fall for real.
scenario:
  id: tray
  description: Carry a tray of glasses with one arm while the other arm visits each glass.
  world: worlds/tray_cell.world.yaml
  seed: 42

  controller:
    planner:
      domain: scenarios/tray.domain.pddl
      facts:
        - can_carry(left)
        - can_visit(right)
      goal:
        - visited(g1)
        - visited(g2)
        - visited(g3)
        - visited(g4)
        - rests(tray, pad_b)

  # Real bodies for the tray and the glasses: the cup of the left arm is at
  # the rigid level, so every box becomes a free body of MuJoCo.
  physics:
    fidelity: abstract
    overrides:
      left_gripper: rigid

  perception: { oracle: always }

  timeout: 90

  assertions:
    - controller.success
    - planner.replans == 0
    - on(tray, pad_b)              # resting on the stand (a real contact)
    # No glass falls nor leaves the tray, at any time.
    - { condition: "on(g1, tray)", phase: always }
    - { condition: "on(g2, tray)", phase: always }
    - { condition: "on(g3, tray)", phase: always }
    - { condition: "on(g4, tray)", phase: always }
    - { condition: "collision_count(left) == 0", phase: always }
    - { condition: "collision_count(right) == 0", phase: always }
    # The visits happen while the tray moves.
    - dual_arm.overlap > 4
