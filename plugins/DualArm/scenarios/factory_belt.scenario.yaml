# The factory fed by a conveyor belt (worlds/factory_belt_cell.world.yaml):
# the GRAFCET generated from scenarios/factory_belt.workflow.yaml runs the
# belt (skill feeder_belt.Run, a device of the cell) for each part, when the
# pick place at its end is free; M1 takes the part there.
scenario:
  id: factory_belt
  description: The factory fed by a conveyor belt - the belt brings each part to M1.
  world: worlds/factory_belt_cell.world.yaml
  seed: 42

  controller:
    grafcet:
      workflow: scenarios/factory_belt.workflow.yaml   # ends at its End step

  perception: { fidelity: truth }   # the simulator gives the poses

  timeout: 240

  assertions:
    - controller.success
    - on(p1a, outfeed)
    - on(p2a, outfeed)
    - on(p3a, outfeed)
    - on(p1b, outfeed)
    - on(p2b, outfeed)
    - on(p3b, outfeed)
    - { condition: "collision_count(M1) == 0", phase: always }
    - { condition: "collision_count(M2) == 0", phase: always }
    - skill_succeeded(M1.Grasp(p3b))
    - time < 90
