# A humanoid (LimX HU_D04_01) walks by a learned policy. The pack data/ is
# generated by make compile-external-libs from the LimX repositories.
plugin:
  id: robotik.humanoid_walk
  name: Humanoid walk
  version: 1.0.0
  api_version: 1
  category: Learning

library:
  entrypoint: librobotik_humanoid_walk.so

resources:
  directory: data

# The plugin steps the simulation at the physics rate of the policy. The
# view (Y-up) looks at the circle walked around the origin.
host:
  clock: plugin
  view:
    eye: [0.0, 2.2, 3.4]
    target: [0.0, 0.5, 0.0]

scenarios:
  directory: scenarios
  entries:
    - { id: walk, name: Walk (panel), file: walk.yml }
    - { id: walk_circle, name: Walk in a circle, file: walk_circle.yml }
