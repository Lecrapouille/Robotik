scenario:
  id: line_follower
  description: Localize on the floor AprilTags, reach the line and follow it for one lap.
  world: worlds/line_track.yaml
  seed: 1

  controller:
    behavior_tree: scenarios/line_follower.bt.yml

  timeout: 200

  assertions:
    - controller.success
    - time < 150
    - cross_track.max < 0.08
    - laps >= 1
