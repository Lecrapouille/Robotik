plugin:
  id: robotik.line_follower
  name: Line follower
  version: 1.0.0
  api_version: 1
  category: Mobile
  description: A mobile robot follows a line and localizes itself with AprilTag markers (OpenCV).

library:
  entrypoint: librobotik_line_follower.so

resources:
  packs:
    - { id: robotik.robots, version: "1.0" }

# Libraries the plugin is built with, and their license. thirdparties with a
# repo are cloned into external/ by make download-external-libs and built by
# the Makefile; system ones come from the system (pkg-config name).
dependencies:
  system:
    - { name: opencv4, license: Apache-2.0 }
  thirdparties:
    - { repo: AprilRobotics/apriltag, license: BSD-2-Clause, description: AprilTag fiducial detection }

host:
  view:
    eye: [0.0, 7.0, 6.0]
    target: [0.0, 0.0, 0.0]

scenarios:
  directory: scenarios
  entries:
    - { id: line_follower, name: Line follower, file: line_follower.scenario.yaml }
