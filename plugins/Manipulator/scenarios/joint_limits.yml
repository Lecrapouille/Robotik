scenario:
  id: joint_limits
  description: |
    Command the shoulder toward its upper stop. The measured position stays
    inside the URDF limits.
  world: ../worlds/arm_cell.yaml
  seed: 1
  timeout: 60
  assertions:
    - limit.inside == 1
    - limit.reached == 1
    - { condition: "joint_limits_respected(robot)", phase: always }
    - time < 30
