scenario:
  id: inverse_kinematics
  description: |
    Move the tool a few centimetres using inverse kinematics. The position
    error starts out of tolerance and becomes green without the assertion
    itself stopping the run.
  world: ../worlds/arm_cell.yaml
  seed: 1
  timeout: 60
  assertions:
    - ik.error < 0.02
    - time < 30
