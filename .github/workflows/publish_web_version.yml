name: Publish the online Robotik Simulator on GitHub page
on:
  push:
    branches:
      - master
  workflow_dispatch:
    branches:
      - master

# GitHub Pages serves the page from an artifact of the run (no gh-pages
# branch): Settings > Pages > Source must be "GitHub Actions".
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A page opened alone in a browser needs the plain Emscripten build. The
  # ExaequOS build only runs inside the ExaequOS desktop (see build_exaequos).
  # Pinocchio, MuJoCo and the OpenGL 4.5 view are not in this page: it opens
  # the plugins (worlds, scenarios, manifests) and the panels.
  build_html5:
    name: Build the web version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Robotik
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install MyMakefile and Emscripten
        uses: ./.makefile/.github/actions/setup
        with:
          emscripten: true
      - name: Compile Robotik-Simulator
        id: build
        run: |
          emmake make Robotik-Simulator
          emmake make -s ci-info >> "$GITHUB_OUTPUT"
      # The old address (Robotik-Simulator.html) keeps working; index.html
      # opens the simulator at the root of the site too.
      - name: Gather the page
        run: |
          mkdir -p site
          cp ${{ steps.build.outputs.build }}/bin/Robotik-Simulator.* site/
          cp site/Robotik-Simulator.html site/index.html
          touch site/.nojekyll
          ls -la site
      - name: Keep the page for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy_html5:
    name: Publish on GitHub Pages
    needs: build_html5
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # The image sets EXAEQUOS and puts emscripten-exa on PATH.
  build_exaequos:
    name: Compile for ExaequOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Robotik
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile with ExaequOS
        run: |
          mkdir -p "$HOME/.cache/exaequos"
          # The image has no cmake package. On its PATH, cmake is the
          # toolchain directory, so emcmake cannot start the real program.
          # Install it as root, then compile as the runner.
          docker run --rm \
            --user root \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/exaequos:/opt/emscripten-exa/cache" \
            -w "$PWD" \
            lecrapouille/exaequos:light \
            bash -s <<'EOF'
          set -e
          apt-get update
          apt-get install -y --no-install-recommends cmake
          chown "$HOST_UID:$HOST_GID" /opt/emscripten-exa/cache
          exec python3 -c 'import os; os.environ["HOME"]="/tmp"; os.setgid(int(os.environ["HOST_GID"])); os.setuid(int(os.environ["HOST_UID"])); os.execvp("bash", ["bash", "-c", "make Robotik-Simulator"])'
          EOF
      - name: Keep the ExaequOS build
        uses: actions/upload-artifact@v4
        with:
          name: Robotik-Simulator-exaequos
          path: build/exaequos-debug/bin/Robotik-Simulator.*
