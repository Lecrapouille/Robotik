<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">The reinforcement learning loop</title>
<desc id="desc">The policy receives an observation and chooses an action. The simulation applies the action and gives a reward and the next observation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="260" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">Learning by trial: observation, action, reward</text>
<rect x="60" y="100" width="200" height="64" rx="10" class="yours"/>
<text x="160.0" y="127.0" text-anchor="middle">Policy</text>
<text x="160.0" y="151.0" class="small" text-anchor="middle">your agent</text>
<rect x="350" y="100" width="200" height="64" rx="10" class="box"/>
<text x="450.0" y="127.0" text-anchor="middle">Action</text>
<text x="450.0" y="151.0" class="small" text-anchor="middle">numbers</text>
<rect x="640" y="100" width="200" height="64" rx="10" class="box"/>
<text x="740.0" y="127.0" text-anchor="middle">Simulation</text>
<text x="740.0" y="151.0" class="small" text-anchor="middle">RobotIK</text>
<path d="M260 132 L345 132" class="arrow"/>
<path d="M550 132 L635 132" class="arrow"/>
<path d="M740 164 L740 215 L160 215 L160 169" class="arrow"/>
<text x="330" y="207" class="small">observation + reward</text>
<rect x="766.2" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="792.2" y="39" class="small">your code</text>
</svg>
