<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">The names that must match</title>
<desc id="desc">The target robotik_my_robot of MyRobot.mk builds librobotik_my_robot.so, which is the library.entrypoint of plugin.yaml. The plugin.id of plugin.yaml is the id returned by describe in Plugin.cpp. The scenario id nod is the same in plugin.yaml, in nod.scenario.yaml and in the table of Plugin.cpp.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="430" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">The same name in two or three files</text>
<rect x="32" y="64" width="200" height="84" rx="10" class="ok"/>
<text x="132" y="112.0" class="small" text-anchor="middle">librobotik_my_robot.so</text>
<rect x="270" y="72" width="598" height="28" rx="10" class="file"/>
<text x="282" y="92" class="small">MyRobot.mk</text>
<text x="440" y="92" class="small">TARGETS += robotik_my_robot</text>
<path d="M232 106.0L265 86" class="line"/>
<rect x="270" y="106" width="598" height="28" rx="10" class="file"/>
<text x="282" y="126" class="small">plugin.yaml</text>
<text x="440" y="126" class="small">library.entrypoint: librobotik_my_robot.so</text>
<path d="M232 106.0L265 120" class="line"/>
<rect x="32" y="172" width="200" height="84" rx="10" class="ok"/>
<text x="132" y="220.0" class="small" text-anchor="middle">robotik.my_robot</text>
<rect x="270" y="180" width="598" height="28" rx="10" class="file"/>
<text x="282" y="200" class="small">plugin.yaml</text>
<text x="440" y="200" class="small">plugin.id: robotik.my_robot</text>
<path d="M232 214.0L265 194" class="line"/>
<rect x="270" y="214" width="598" height="28" rx="10" class="yours"/>
<text x="282" y="234" class="small">Plugin.cpp</text>
<text x="440" y="234" class="small">describe() { .id = "robotik.my_robot" }</text>
<path d="M232 214.0L265 228" class="line"/>
<rect x="32" y="280" width="200" height="118" rx="10" class="ok"/>
<text x="132" y="345.0" class="small" text-anchor="middle">nod</text>
<rect x="270" y="288" width="598" height="28" rx="10" class="file"/>
<text x="282" y="308" class="small">plugin.yaml</text>
<text x="440" y="308" class="small">scenarios.entries: { id: nod, … }</text>
<path d="M232 339.0L265 302" class="line"/>
<rect x="270" y="322" width="598" height="28" rx="10" class="file"/>
<text x="282" y="342" class="small">nod.scenario.yaml</text>
<text x="440" y="342" class="small">id: nod</text>
<path d="M232 339.0L265 336" class="line"/>
<rect x="270" y="356" width="598" height="28" rx="10" class="yours"/>
<text x="282" y="376" class="small">Plugin.cpp</text>
<text x="440" y="376" class="small">{ "nod", robotik::logic&lt;NodLogic&gt;() }</text>
<path d="M232 339.0L265 370" class="line"/>
<rect x="656.4" y="24" width="18" height="18" rx="3" class="file"/>
<text x="682.4" y="39" class="small">your YAML</text>
<rect x="766.1999999999999" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="792.1999999999999" y="39" class="small">your code</text>
</svg>
