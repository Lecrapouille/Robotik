<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">Task: the cell runs a skill</title>
<desc id="desc">Registering Raise does not start it. Running the skill starts the scheduler and steps the cell. Raise reads joint measurements and commands the robot until success, or the run reaches its time limit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 16px;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
</style>
<rect width="900" height="350" rx="16" fill="#f5f8fc"/>

<text x="32" y="40" class="heading">Task · The cell runs the skill for you</text>
<rect x="32" y="75" width="245" height="80" rx="10" class="box"/>
<text x="50" y="108">add&lt;MoveJointSkill&gt;</text>
<text x="50" y="135" class="small">Register “Raise”</text>
<path d="M277 115H325" class="arrow"/>
<rect x="330" y="75" width="235" height="80" rx="10" class="box"/>
<text x="350" y="108">run(raise, 10 s)</text>
<text x="350" y="135" class="small">Start + step the cell</text>
<path d="M565 115H615" class="arrow"/>
<rect x="620" y="75" width="248" height="80" rx="10" class="box"/>
<text x="640" y="108">Raise → joint2</text>
<text x="640" y="135" class="small">Command the 0.5 rad target</text>
<path d="M745 155V185H447V160" class="arrow"/>
<text x="470" y="211" class="small">Repeat while the skill runs</text>
<rect x="32" y="240" width="836" height="80" rx="10" fill="#e8f3ed" stroke="#33805a" stroke-width="2"/>
<text x="52" y="272">Target reached → Succeeded</text>
<text x="52" y="300" class="small">10 s limit reached → inspect the returned state before continuing</text>

</svg>
