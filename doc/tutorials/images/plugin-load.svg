<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">How a host loads a plugin</title>
<desc id="desc">The host reads plugin.yaml, loads the shared library when you choose a scenario, asks the Plugin class for the scenario logic of this scenario, builds the simulation from the world and scenario files, then calls the scenario logic at each step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
</style>
<rect width="900" height="420" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">A host loads your plugin</text>

<rect x="32" y="70" width="250" height="300" rx="10" class="box"/>
<text x="50" y="102">Host</text>
<text x="50" y="126" class="small">RobotIK-Simulator or</text>
<text x="50" y="146" class="small">RobotIK-Headless</text>
<text x="50" y="190" class="small">1. reads plugin.yaml</text>
<text x="50" y="235" class="small">2. loads the .so when you</text>
<text x="50" y="255" class="small">choose a scenario</text>
<text x="50" y="300" class="small">3. builds the simulation</text>
<text x="50" y="345" class="small">4. steps it</text>

<rect x="360" y="70" width="230" height="80" rx="10" class="file"/>
<text x="378" y="102">plugin.yaml</text>
<text x="378" y="128" class="small">id, library, scenarios</text>
<path d="M282 185H320V110H355" class="arrow"/>

<rect x="360" y="180" width="230" height="80" rx="10" class="yours"/>
<text x="378" y="212">Plugin class</text>
<text x="378" y="238" class="small">scenario id → logic</text>
<path d="M282 245H355" class="arrow"/>

<rect x="640" y="70" width="230" height="80" rx="10" class="file"/>
<text x="658" y="102">world + scenario</text>
<text x="658" y="128" class="small">the YAML files</text>
<path d="M282 295H620V150" class="arrow"/>

<rect x="640" y="250" width="230" height="120" rx="10" class="yours"/>
<text x="658" y="282">ScenarioLogic</text>
<text x="658" y="308" class="small">act, observe, measure,</text>
<text x="658" y="328" class="small">status: at each step</text>
<path d="M590 220H700V245" class="arrow"/>
<path d="M282 340H635" class="arrow"/>

<rect x="360" y="300" width="18" height="18" rx="3" class="yours"/>
<text x="386" y="315" class="small">your C++</text>
<rect x="470" y="300" width="18" height="18" rx="3" class="file"/>
<text x="496" y="315" class="small">your YAML</text>
</svg>
