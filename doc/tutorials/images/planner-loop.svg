<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">The planner loop</title>
<desc id="desc">The planner reads the goal and the domain, and the current state from the observers. It finds a plan: detect, pick, place. Each action runs its skills through the bindings. The skills change the world; the camera updates the beliefs; the observers read the beliefs. If a step fails or an effect is not seen, the planner plans again from the new state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
</style>
<rect width="900" height="420" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">A goal, a plan, and a new plan when a step fails</text>

<rect x="32" y="70" width="210" height="100" rx="10" class="file"/>
<text x="50" y="102">Domain + goal</text>
<text x="50" y="128" class="small">actions: detect, pick, place</text>
<text x="50" y="148" class="small">goal: (in red_cube box)</text>
<path d="M242 120H297" class="arrow"/>

<rect x="302" y="70" width="210" height="100" rx="10" class="box"/>
<text x="320" y="102">Planner</text>
<text x="320" y="128" class="small">finds the actions that</text>
<text x="320" y="148" class="small">make the goal true</text>
<path d="M512 120H567" class="arrow"/>

<rect x="572" y="70" width="298" height="100" rx="10" class="box"/>
<text x="590" y="102">Plan</text>
<text x="590" y="128" class="small">(detect red_cube) (pick red_cube)</text>
<text x="590" y="148" class="small">(place red_cube box)</text>
<path d="M720 170V225" class="arrow"/>

<rect x="572" y="230" width="298" height="100" rx="10" class="yours"/>
<text x="590" y="262">Bindings → skills</text>
<text x="590" y="288" class="small">pick = Approach, Reach, Grasp,</text>
<text x="590" y="308" class="small">Approach</text>
<path d="M572 280H517" class="arrow"/>
<text x="530" y="270" class="small">act</text>

<rect x="302" y="230" width="210" height="100" rx="10" class="box"/>
<text x="320" y="262">Robot and world</text>
<text x="320" y="288" class="small">the camera updates</text>
<text x="320" y="308" class="small">the beliefs</text>
<path d="M302 280H247" class="arrow"/>

<rect x="32" y="230" width="210" height="100" rx="10" class="yours"/>
<text x="50" y="262">Observers</text>
<text x="50" y="288" class="small">read the beliefs:</text>
<text x="50" y="308" class="small">is (seen red_cube) true?</text>
<path d="M137 230V200H407V175" class="arrow"/>
<text x="160" y="195" class="small">the state now</text>

<text x="32" y="370" class="small">A step fails, or its effect is not seen in the beliefs: the planner plans again from the state now.</text>
<rect x="660" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="686" y="39" class="small">your C++</text>
<rect x="770" y="24" width="18" height="18" rx="3" class="file"/>
<text x="796" y="39" class="small">YAML/PDDL</text>
</svg>
