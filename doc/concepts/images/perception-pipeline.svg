<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">The perception pipeline</title>
<desc id="desc">The camera gives a CameraFrame. The PerceptionPipeline runs its detectors (color, AprilTag, depth) and gives detections. The detections update the WorldModel: the beliefs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="330" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">From an image to a belief</text>
<rect x="32" y="70" width="140" height="60" rx="10" class="box"/>
<text x="102.0" y="106.0" text-anchor="middle">Camera</text>
<rect x="206" y="70" width="160" height="60" rx="10" class="box"/>
<text x="286.0" y="106.0" text-anchor="middle">CameraFrame</text>
<rect x="400" y="70" width="200" height="60" rx="10" class="box"/>
<text x="500.0" y="106.0" text-anchor="middle">PerceptionPipeline</text>
<rect x="634" y="70" width="120" height="60" rx="10" class="box"/>
<text x="694.0" y="106.0" text-anchor="middle">Detections</text>
<rect x="728" y="160" width="140" height="60" rx="10" class="box"/>
<text x="798.0" y="196.0" text-anchor="middle">WorldModel</text>
<path d="M172 100 L201 100" class="arrow"/>
<path d="M366 100 L395 100" class="arrow"/>
<path d="M600 100 L629 100" class="arrow"/>
<path d="M754 100 L798 100 L798 155" class="arrow"/>
<rect x="420" y="165" width="260" height="40" rx="10" class="yours"/>
<text x="550.0" y="191.0" text-anchor="middle">ColorDetector (plugin)</text>
<rect x="420" y="215" width="260" height="40" rx="10" class="yours"/>
<text x="550.0" y="241.0" text-anchor="middle">AprilTagDetector (plugin)</text>
<rect x="420" y="265" width="260" height="40" rx="10" class="box"/>
<text x="550.0" y="291.0" text-anchor="middle">DepthEstimator</text>
<path d="M410 130V275M410 185H420M410 235H420M410 275H420" class="line"/>
<text x="728" y="245" class="note">the beliefs</text>
<rect x="672.8" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="698.8" y="39" class="small">your code</text>
<rect x="782.5999999999999" y="24" width="18" height="18" rx="3" class="box"/>
<text x="808.5999999999999" y="39" class="small">RobotIK</text>
</svg>
