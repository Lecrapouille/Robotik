<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">The control loop</title>
<desc id="desc">The program reads the sensors, decides, sends commands to the actuators, waits a little, and starts again, many times per second.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="330" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">The loop of a robot program, many times per second</text>
<rect x="60" y="90" width="340" height="64" rx="10" class="box"/>
<text x="230.0" y="128.0" text-anchor="middle">Read the sensors</text>
<rect x="500" y="90" width="340" height="64" rx="10" class="box"/>
<text x="670.0" y="128.0" text-anchor="middle">Decide</text>
<rect x="500" y="220" width="340" height="64" rx="10" class="box"/>
<text x="670.0" y="258.0" text-anchor="middle">Send commands</text>
<rect x="60" y="220" width="340" height="64" rx="10" class="box"/>
<text x="230.0" y="258.0" text-anchor="middle">Wait a little</text>
<path d="M400 122 L495 122" class="arrow"/>
<path d="M670 154 L670 215" class="arrow"/>
<path d="M500 252 L405 252" class="arrow"/>
<path d="M230 220 L230 159" class="arrow"/>
<text x="240" y="195" class="note">again</text>
</svg>
