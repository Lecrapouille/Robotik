<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">A small behavior tree</title>
<desc id="desc">A Sequence runs Home, then a Selector, then Grasp. The Selector tries Detect(red_cube); if it fails, it tries Home.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="400" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">A behavior tree: Sequence and Selector</text>
<rect x="370" y="64" width="160" height="56" rx="10" class="file"/>
<text x="450.0" y="98.0" text-anchor="middle">Sequence</text>
<text x="545" y="98" class="note">do the children one after the other</text>
<path d="M450 120V150M150 150H750M150 150V170M450 150V170M750 150V170" class="line"/>
<rect x="70" y="175" width="160" height="56" rx="10" class="yours"/>
<text x="150.0" y="209.0" text-anchor="middle">Home</text>
<text x="70" y="252" class="note">a skill</text>
<rect x="370" y="175" width="160" height="56" rx="10" class="file"/>
<text x="450.0" y="209.0" text-anchor="middle">Selector</text>
<rect x="670" y="175" width="160" height="56" rx="10" class="yours"/>
<text x="750.0" y="209.0" text-anchor="middle">Grasp(red_cube)</text>
<path d="M450 231V260M330 260H570M330 260V280M570 260V280" class="line"/>
<rect x="240" y="285" width="180" height="56" rx="10" class="yours"/>
<text x="330.0" y="319.0" text-anchor="middle">Detect(red_cube)</text>
<rect x="480" y="285" width="180" height="56" rx="10" class="yours"/>
<text x="570.0" y="319.0" text-anchor="middle">Home</text>
<text x="32" y="375" class="note">Selector (a fallback): try the first child; if it fails, try the next one.</text>
<rect x="656.4" y="24" width="18" height="18" rx="3" class="file"/>
<text x="682.4" y="39" class="small">your YAML</text>
<rect x="766.1999999999999" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="792.1999999999999" y="39" class="small">your code</text>
</svg>
