<title id="title">RobotIK connects existing libraries</title>
<desc id="desc">Your program, a plugin, uses RobotIK: scenarios, skills, planner, behavior trees, perception and tests. RobotIK uses MuJoCo for physics, Pinocchio for kinematics, Kairos and BlackThorn for planning and behavior trees, and Compages for the 3D world and the display.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="360" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">RobotIK connects good libraries</text>
<rect x="300" y="64" width="300" height="56" rx="10" class="yours"/>
<text x="450.0" y="98.0" text-anchor="middle">Your program (a plugin)</text>
<path d="M450 120 L450 145" class="arrow"/>
<rect x="32" y="150" width="836" height="70" rx="10" class="box"/>
<text x="450.0" y="180.0" text-anchor="middle">RobotIK</text>
<text x="450.0" y="204.0" class="small" text-anchor="middle">scenarios · skills · planner · behavior trees · perception · tests</text>
<rect x="32" y="260" width="194" height="70" rx="10" class="lib"/>
<text x="129.0" y="290.0" text-anchor="middle">MuJoCo</text>
<text x="129.0" y="314.0" class="small" text-anchor="middle">physics</text>
<path d="M129 220 L129 255" class="arrow"/>
<rect x="246" y="260" width="194" height="70" rx="10" class="lib"/>
<text x="343.0" y="290.0" text-anchor="middle">Pinocchio</text>
<text x="343.0" y="314.0" class="small" text-anchor="middle">kinematics</text>
<path d="M343 220 L343 255" class="arrow"/>
<rect x="460" y="260" width="194" height="70" rx="10" class="lib"/>
<text x="557.0" y="290.0" text-anchor="middle">Kairos · BlackThorn</text>
<text x="557.0" y="314.0" class="small" text-anchor="middle">planner · behavior trees</text>
<path d="M557 220 L557 255" class="arrow"/>
<rect x="674" y="260" width="194" height="70" rx="10" class="lib"/>
<text x="771.0" y="290.0" text-anchor="middle">Compages</text>
<text x="771.0" y="314.0" class="small" text-anchor="middle">3D world, display</text>
<path d="M771 220 L771 255" class="arrow"/>
<rect x="574.4000000000001" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="600.4000000000001" y="39" class="small">your code</text>
<rect x="684.2" y="24" width="18" height="18" rx="3" class="lib"/>
