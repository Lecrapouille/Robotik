<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">The backend of a robot session</title>
<desc id="desc">A RobotSession uses a RobotBackend. The MuJoCo backend reads and writes the joint positions and velocities of the simulation. A hardware backend, planned, will talk to the servos on their bus.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="340" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">Simulated or real: the same session</text>
<rect x="330" y="64" width="240" height="50" rx="10" class="box"/>
<text x="450.0" y="95.0" text-anchor="middle">RobotSession</text>
<path d="M450 114 L450 140" class="arrow"/>
<rect x="330" y="145" width="240" height="50" rx="10" class="box"/>
<text x="450.0" y="176.0" text-anchor="middle">RobotBackend</text>
<path d="M450 195 L450 215 L230 215 L230 235" class="arrow"/>
<path d="M450 215 L670 215 L670 235" class="arrow"/>
<rect x="110" y="240" width="240" height="70" rx="10" class="box"/>
<text x="230.0" y="270.0" text-anchor="middle">MujocoBackend</text>
<text x="230.0" y="294.0" class="small" text-anchor="middle">qpos / qvel</text>
<rect x="550" y="240" width="240" height="70" rx="10" class="future"/>
<text x="670.0" y="270.0" text-anchor="middle">HardwareBackend</text>
<text x="670.0" y="294.0" class="small" text-anchor="middle">servo / bus · planned</text>
</svg>
