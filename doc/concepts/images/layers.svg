<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">The four layers of RobotIK</title>
<desc id="desc">Package: files and plugins, Simulation, RunReport, the YAML files, assertions, plugin ABI. Task: a job in C++, RoboticCell, ScenarioLogic, SkillScheduler, skills, WorldModel, planning, grasp, learning. Robot: one robot, Robot, RobotRuntime, joints, sensors, actuators, resources, backends, asset packs. Common: units, poses, Result, Signal, Config, Random. Each layer uses only the layers below it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="500" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">Each layer uses only the layers below it</text>
<rect x="32" y="64" width="836" height="90" rx="10" class="box"/>
<text x="52" y="96">Package</text>
<text x="150" y="96" class="note">files and plugins</text>
<text x="52" y="122" class="small">Simulation (scenario = cell + verdict), RunReport, World / Scenario / Experiment YAML,</text>
<text x="52" y="140" class="small">Assertions, plugin ABI</text>
<path d="M450 154 L450 168" class="arrow"/>
<rect x="32" y="170" width="836" height="90" rx="10" class="box"/>
<text x="52" y="202">Task</text>
<text x="150" y="202" class="note">a job in C++</text>
<text x="52" y="228" class="small">RoboticCell (step loop, controllers, truth), ScenarioLogic, SkillScheduler, skills, WorldModel,</text>
<text x="52" y="246" class="small">Planning (PDDL), Grasp, Learning</text>
<path d="M450 260 L450 274" class="arrow"/>
<rect x="32" y="276" width="836" height="90" rx="10" class="box"/>
<text x="52" y="308">Robot</text>
<text x="150" y="308" class="note">one robot</text>
<text x="52" y="334" class="small">Robot, RobotRuntime, StandaloneRobot, joints, sensors, actuators, resources, backends (MuJoCo,</text>
<text x="52" y="352" class="small">Pinocchio), asset packs</text>
<path d="M450 366 L450 380" class="arrow"/>
<rect x="32" y="382" width="836" height="90" rx="10" class="box"/>
<text x="52" y="414">Common</text>
<text x="150" y="414" class="note">small tools</text>
<text x="52" y="440" class="small">units and poses (from Compages), Result, Signal, Config, Random</text>
</svg>
