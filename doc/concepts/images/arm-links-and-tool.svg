<title id="title">Links, joints and the tool center point</title>
<desc id="desc">A schematic arm has two rigid links connected by revolute joints. A tool attaches to the flange. The TCP is at the tip of the tool.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 16px;}
.link {fill: none; stroke: #397baf; stroke-width: 26; stroke-linecap: round;}
.joint {fill: #fff; stroke: #20334b; stroke-width: 5;}
.guide {fill: none; stroke: #52657a; stroke-width: 2;}
.arrow {fill: none; stroke: #52657a; stroke-width: 3; marker-end: url(#arrow);}
</style>
<rect width="900" height="390" rx="16" fill="#f5f8fc"/>

<text x="32" y="38" class="heading">The body and the working point</text>
<path d="M65 330H835" class="guide"/>
<path d="M110 330V296H210V330" fill="#c7d2df" stroke="#20334b" stroke-width="3"/>
<path d="M160 290L280 135L500 180" class="link"/>
<circle cx="160" cy="290" r="17" class="joint"/>
<circle cx="280" cy="135" r="17" class="joint"/>
<rect x="494" y="158" width="14" height="44" rx="3" fill="#20334b"/>
<path d="M510 180H595" stroke="#d58a26" stroke-width="20"/>
<path d="M595 161V199M595 180H633" stroke="#d58a26" stroke-width="5"/>
<circle cx="633" cy="180" r="7" fill="#b83959"/>
<text x="80" y="365">Fixed base</text>
