<text x="150" y="120">Link</text><path d="M182 130L210 202" class="guide"/>
<text x="350" y="104">Link</text><path d="M370 112L390 155" class="guide"/>
<text x="288" y="270">Joint (turns)</text><path d="M302 248L281 155" class="guide"/>
<text x="465" y="292">Flange</text><path d="M500 271V205" class="guide"/>
<text x="549" y="114">Tool</text><path d="M568 122V166" class="guide"/>
