<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">Hosts and plugins</title>
<desc id="desc">RobotIK-Simulator and RobotIK-Headless are the two hosts. A PluginSession reads the catalog and the packs, loads the plugin library with dlopen, and runs its lifecycle. The plugin binds its scenario logic to the Simulation of librobotik-core.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="355" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">Two hosts, one plugin border</text>
<rect x="150" y="64" width="260" height="56" rx="10" class="box"/>
<text x="280.0" y="98.0" text-anchor="middle">RobotIK-Simulator</text>
<rect x="490" y="64" width="260" height="56" rx="10" class="box"/>
<text x="620.0" y="98.0" text-anchor="middle">RobotIK-Headless</text>
<text x="770" y="96" class="note">the two hosts</text>
<path d="M280 120 L280 140 L450 140 L450 170" class="arrow"/>
<path d="M620 120 L620 140 L450 140" class="line"/>
<text x="465" y="160" class="small">PluginSession: catalog, packs, dlopen, lifecycle</text>
<rect x="300" y="175" width="300" height="56" rx="10" class="yours"/>
<text x="450.0" y="209.0" text-anchor="middle">librobotik_&lt;name&gt;.so</text>
<text x="620" y="208" class="note">a plugin (C ABI border)</text>
<path d="M450 231 L450 270" class="arrow"/>
<text x="465" y="256" class="small">bindLogic</text>
<rect x="270" y="275" width="360" height="56" rx="10" class="box"/>
<text x="450.0" y="309.0" text-anchor="middle">Simulation + ScenarioLogic</text>
<text x="650" y="308" class="note">librobotik-core</text>
<rect x="766.2" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="792.2" y="39" class="small">your code</text>
</svg>
