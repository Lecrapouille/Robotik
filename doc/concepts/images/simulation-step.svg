<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">One simulation step</title>
<desc id="desc">Simulation::step steps the RoboticCell, then decides if the run ends, then updates the assertions. RoboticCell::step updates the faults, ticks the controller, updates the scheduler, steps every robot session, updates the grasps, the perception, the ground truth, then calls the scenario logic.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="640" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">Simulation::step(dt), in this order</text>
<rect x="32" y="64" width="836" height="420" rx="10" class="box"/>
<text x="48" y="94">RoboticCell::step(dt)</text>
<rect x="56" y="108" width="788" height="40" rx="10" class="box"/>
<text x="72" y="134">FaultInjector::update</text>
<text x="450" y="134" class="small">faults on / off: resources available or not</text>
<rect x="56" y="154" width="788" height="40" rx="10" class="box"/>
<text x="72" y="180">controller tick</text>
<text x="450" y="180" class="small">behavior tree or plan: requests and cancels skills</text>
<rect x="56" y="200" width="788" height="40" rx="10" class="box"/>
<text x="72" y="226">SkillScheduler::update</text>
<text x="450" y="226" class="small">admit, preempt, tick the skills</text>
<rect x="56" y="246" width="788" height="40" rx="10" class="box"/>
<text x="72" y="272">RobotSession prepare / advance / sense</text>
<text x="450" y="272" class="small">every robot: actuators, one physics step, sensors</text>
<rect x="56" y="292" width="788" height="40" rx="10" class="box"/>
<text x="72" y="318">GraspModel::update</text>
<text x="450" y="318" class="small">what the grippers hold</text>
<rect x="56" y="338" width="788" height="40" rx="10" class="box"/>
<text x="72" y="364">observe()</text>
<text x="450" y="364" class="small">perception → WorldModel (or the truth: fidelity)</text>
<rect x="56" y="384" width="788" height="40" rx="10" class="box"/>
<text x="72" y="410">track / syncBodies</text>
<text x="450" y="410" class="small">ground truth of the bodies, contacts</text>
<rect x="56" y="430" width="788" height="40" rx="10" class="yours"/>
<text x="72" y="456">ScenarioLogic act / simulate / observe</text>
<text x="450" y="456" class="small">then status, if there is no controller</text>
<rect x="32" y="500" width="836" height="50" rx="10" class="box"/>
<text x="52" y="531">end of run?</text>
<text x="300" y="531" class="small">controller, stop_when, timeout, stop: true</text>
<rect x="32" y="566" width="836" height="50" rx="10" class="box"/>
<text x="52" y="597">AssertionEngine::update</text>
<text x="300" y="597" class="small">verdicts, on the ground truth</text>
<path d="M450 484 L450 497" class="arrow"/>
<path d="M450 550 L450 563" class="arrow"/>
<rect x="766.2" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="792.2" y="39" class="small">your code</text>
</svg>
