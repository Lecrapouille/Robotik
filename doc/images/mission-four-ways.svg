<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">From your files to four ways of running</title>
<desc id="desc">You write a world file, a scenario file and skills in C++. RobotIK runs them in the 3D simulator, as a headless test in CI, as a reinforcement learning environment, and later on a real robot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="400" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">Write the mission once, run it four ways</text>
<rect x="32" y="70" width="250" height="80" rx="10" class="file"/>
<text x="48" y="100">world.yaml</text>
<text x="48" y="126" class="small">robot, cube, box</text>
<rect x="325" y="70" width="250" height="80" rx="10" class="file"/>
<text x="341" y="100">scenario.yaml</text>
<text x="341" y="126" class="small">goal, faults, assertions</text>
<rect x="618" y="70" width="250" height="80" rx="10" class="yours"/>
<text x="634" y="100">skills (C++)</text>
<text x="634" y="126" class="small">Detect, Grasp, Release…</text>
<rect x="325" y="190" width="250" height="56" rx="10" class="box"/>
<text x="450.0" y="224.0" text-anchor="middle">RobotIK</text>
<path d="M157 150 L157 170 L450 170 L450 185" class="arrow"/>
<path d="M450 150 L450 185" class="arrow"/>
<path d="M743 150 L743 170 L450 170 L450 185" class="arrow"/>
<rect x="32" y="290" width="190" height="80" rx="10" class="box"/>
<text x="48" y="320">3D simulator</text>
<text x="48" y="346" class="small">see and debug</text>
<rect x="250" y="290" width="190" height="80" rx="10" class="box"/>
<text x="266" y="320">headless test</text>
<text x="266" y="346" class="small">PASS / FAIL in CI</text>
<rect x="468" y="290" width="190" height="80" rx="10" class="box"/>
<text x="484" y="320">RL environment</text>
<text x="484" y="346" class="small">N in parallel</text>
<rect x="686" y="290" width="182" height="80" rx="10" class="future"/>
<text x="702" y="320">real robot</text>
<text x="702" y="346" class="small">planned</text>
<path d="M450 246 L450 268 L127 268 L127 285" class="arrow"/>
<path d="M450 246 L450 268 L345 268 L345 285" class="arrow"/>
<path d="M450 246 L450 268 L563 268 L563 285" class="arrow"/>
<path d="M450 246 L450 268 L777 268 L777 285" class="arrow"/>
<rect x="563.0" y="24" width="18" height="18" rx="3" class="file"/>
<text x="589.0" y="39" class="small">your YAML</text>
<rect x="672.8" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="698.8" y="39" class="small">your code</text>
<rect x="782.5999999999999" y="24" width="18" height="18" rx="3" class="future"/>
<text x="808.5999999999999" y="39" class="small">planned</text>
</svg>
