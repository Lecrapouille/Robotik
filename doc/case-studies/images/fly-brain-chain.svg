<title id="title">FlyBrain: from the senses to the body</title>
<desc id="desc">Sensors give an observation; the brain model chooses an action; a controller turns it into commands of the body.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="170" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">FlyBrain: the brain is the policy</text>
<rect x="32" y="80" width="118" height="64" rx="10" class="box"/>
<text x="91.0" y="118.0" text-anchor="middle">sensors</text>
<path d="M150 112 L172 112" class="arrow"/>
<rect x="176" y="80" width="118" height="64" rx="10" class="box"/>
<text x="235.0" y="118.0" text-anchor="middle">observation</text>
<path d="M293 112 L315 112" class="arrow"/>
<rect x="319" y="80" width="118" height="64" rx="10" class="yours"/>
<text x="378.0" y="118.0" text-anchor="middle">brain</text>
<path d="M437 112 L459 112" class="arrow"/>
<rect x="463" y="80" width="118" height="64" rx="10" class="box"/>
<text x="522.0" y="118.0" text-anchor="middle">action</text>
<path d="M581 112 L603 112" class="arrow"/>
<rect x="607" y="80" width="118" height="64" rx="10" class="box"/>
<text x="666.0" y="118.0" text-anchor="middle">controller</text>
<path d="M724 112 L746 112" class="arrow"/>
<rect x="750" y="80" width="118" height="64" rx="10" class="box"/>
<text x="809.0" y="118.0" text-anchor="middle">body</text>
</svg>
