<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">PickAndPlace: the skills in order</title>
<desc id="desc">Home, Detect, Approach, Reach, Grasp, Approach, Transit to the box, Approach the box, Release, Home.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="250" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">PickAndPlace: the skills of one pick and place</text>
<rect x="32" y="80" width="146" height="50" rx="10" class="yours"/>
<text x="105.0" y="111.0" text-anchor="middle">Home</text>
<path d="M178 105 L200 105" class="arrow"/>
<rect x="204" y="80" width="146" height="50" rx="10" class="yours"/>
<text x="277.0" y="111.0" text-anchor="middle">Detect</text>
<path d="M350 105 L372 105" class="arrow"/>
<rect x="376" y="80" width="146" height="50" rx="10" class="yours"/>
<text x="449.0" y="111.0" text-anchor="middle">Approach</text>
<path d="M522 105 L544 105" class="arrow"/>
<rect x="548" y="80" width="146" height="50" rx="10" class="yours"/>
<text x="621.0" y="111.0" text-anchor="middle">Reach</text>
<path d="M694 105 L716 105" class="arrow"/>
<rect x="720" y="80" width="146" height="50" rx="10" class="yours"/>
<text x="793.0" y="111.0" text-anchor="middle">Grasp</text>
<rect x="32" y="160" width="146" height="50" rx="10" class="yours"/>
<text x="105.0" y="191.0" text-anchor="middle">Approach</text>
<path d="M178 185 L200 185" class="arrow"/>
<rect x="204" y="160" width="146" height="50" rx="10" class="yours"/>
<text x="277.0" y="191.0" text-anchor="middle">Transit(box)</text>
<path d="M350 185 L372 185" class="arrow"/>
<rect x="376" y="160" width="146" height="50" rx="10" class="yours"/>
<text x="449.0" y="191.0" text-anchor="middle">Approach(box)</text>
<path d="M522 185 L544 185" class="arrow"/>
<rect x="548" y="160" width="146" height="50" rx="10" class="yours"/>
<text x="621.0" y="191.0" text-anchor="middle">Release</text>
<path d="M694 185 L716 185" class="arrow"/>
<rect x="720" y="160" width="146" height="50" rx="10" class="yours"/>
<text x="793.0" y="191.0" text-anchor="middle">Home</text>
<path d="M793 130 L793 145 L105 145 L105 155" class="arrow"/>
</svg>
