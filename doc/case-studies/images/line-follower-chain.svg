<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">LineFollower: from the camera to the wheels</title>
<desc id="desc">The camera image goes to perception (AprilTag and line detectors), then to localisation, then to the controller, which drives the differential robot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="170" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">LineFollower: from the camera to the wheels</text>
<rect x="32" y="80" width="146" height="64" rx="10" class="box"/>
<text x="105.0" y="118.0" text-anchor="middle">camera</text>
<path d="M178 112 L200 112" class="arrow"/>
<rect x="204" y="80" width="146" height="64" rx="10" class="yours"/>
<text x="277.0" y="107.0" text-anchor="middle">perception</text>
<text x="277.0" y="131.0" class="small" text-anchor="middle">AprilTag, line</text>
<path d="M351 112 L373 112" class="arrow"/>
<rect x="377" y="80" width="146" height="64" rx="10" class="yours"/>
<text x="450.0" y="118.0" text-anchor="middle">localisation</text>
<path d="M523 112 L545 112" class="arrow"/>
<rect x="549" y="80" width="146" height="64" rx="10" class="yours"/>
<text x="622.0" y="118.0" text-anchor="middle">controller</text>
<path d="M696 112 L718 112" class="arrow"/>
<rect x="722" y="80" width="146" height="64" rx="10" class="box"/>
<text x="795.0" y="107.0" text-anchor="middle">differential</text>
<text x="795.0" y="131.0" class="small" text-anchor="middle">robot</text>
</svg>
