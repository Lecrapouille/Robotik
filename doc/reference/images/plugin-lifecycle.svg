<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-RobotIK-Commercial -->
<title id="title">The life of a plugin</title>
<desc id="desc">The host reads plugin.yaml and checks api_version, packs and dependencies. It loads the library only when a scenario of this plugin is chosen, checks the build id, calls setup with the scenario id, builds the Simulation, starts it, steps it, stops it, and shuts it down.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657a"/></marker></defs>
<style>
text {font-family: sans-serif; font-size: 18px; fill: #20334b;}
.heading {font-size: 23px; font-weight: bold;}
.small {font-size: 15px;}
.note {font-size: 15px; fill: #52657a; font-style: italic;}
.box {fill: #fff; stroke: #397baf; stroke-width: 2;}
.yours {fill: #fff7e6; stroke: #c98a1b; stroke-width: 2;}
.file {fill: #eef4ea; stroke: #5f8f4e; stroke-width: 2;}
.lib {fill: #eceff3; stroke: #7a8796; stroke-width: 2;}
.future {fill: #f5f8fc; stroke: #7a8796; stroke-width: 2; stroke-dasharray: 6 4;}
.fail {fill: #fdecee; stroke: #b5345a; stroke-width: 2;}
.ok {fill: #e9f5ec; stroke: #3d8b57; stroke-width: 2;}
.line {fill: none; stroke: #52657a; stroke-width: 2;}
.dashed {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5;}
.arrow {fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow);}
.darrow {fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow);}
</style>
<rect width="900" height="760" rx="16" fill="#f5f8fc"/>
<text x="32" y="40" class="heading">The life of a plugin, from the host</text>
<rect x="32" y="64" width="836" height="56" rx="10" class="box"/>
<text x="52" y="98">plugin.yaml read</text>
<text x="250" y="98" class="small">the host checks api_version, packs, dependencies</text>
<path d="M140 120 L140 140" class="arrow"/>
<rect x="32" y="140" width="836" height="56" rx="10" class="box"/>
<text x="52" y="174">dlopen(.so)</text>
<text x="250" y="174" class="small">only when a scenario of this plugin is chosen</text>
<path d="M140 196 L140 216" class="arrow"/>
<rect x="32" y="216" width="836" height="56" rx="10" class="box"/>
<text x="52" y="250">build id</text>
<text x="250" y="250" class="small">robotik_plugin_build_id must be the text of the host</text>
<path d="M140 272 L140 292" class="arrow"/>
<rect x="32" y="292" width="836" height="56" rx="10" class="yours"/>
<text x="52" y="326">setup(scenario id)</text>
<text x="250" y="326" class="small">create the ScenarioLogic (ScenarioPlugin), menus, panels</text>
<path d="M140 348 L140 368" class="arrow"/>
<rect x="32" y="368" width="836" height="56" rx="10" class="box"/>
<text x="52" y="402">Simulation built</text>
<text x="250" y="402" class="small">world + scenario; ScenarioLogic::setup, then reset</text>
<path d="M140 424 L140 444" class="arrow"/>
<rect x="32" y="444" width="836" height="56" rx="10" class="box"/>
<text x="52" y="478">start</text>
<text x="250" y="478" class="small"></text>
<path d="M140 500 L140 520" class="arrow"/>
<rect x="32" y="520" width="836" height="56" rx="10" class="yours"/>
<text x="52" y="554">loop</text>
<text x="250" y="554" class="small">RoboticCell::step → act, simulate, observe → Plugin::update(dt)</text>
<path d="M140 576 L140 596" class="arrow"/>
<rect x="32" y="596" width="836" height="56" rx="10" class="box"/>
<text x="52" y="630">stop</text>
<text x="250" y="630" class="small">the simulation still exists</text>
<path d="M140 652 L140 672" class="arrow"/>
<rect x="32" y="672" width="836" height="56" rx="10" class="box"/>
<text x="52" y="706">shutdown</text>
<text x="250" y="706" class="small">the simulation is destroyed: free the scenario logic; the .so can stay loaded</text>
<rect x="766.2" y="24" width="18" height="18" rx="3" class="yours"/>
<text x="792.2" y="39" class="small">your code</text>
</svg>
