scenario: painter
seed: 7

robot:
  model: robot_6axis.urdf
  tools:
    default: tool_default.urdf
  mounted: default
  # Tool pointing down, clear of the easel.
  home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
  actuators:
    arm:
      type: joint_group

world:
  # Pots sit between the robot and the easel skids. They are decorations:
  # the free canvas and the floating easel are created by the mission.
  objects:
    red:
      type: cube
      size: [0.07, 0.07, 0.07]
      color: [0.82, 0.18, 0.18]
      position: [0.42, 0.22, 0.035]
    black:
      type: cube
      size: [0.07, 0.07, 0.07]
      color: [0.10, 0.10, 0.12]
      position: [0.42, 0.08, 0.035]
    blue:
      type: cube
      size: [0.07, 0.07, 0.07]
      color: [0.10, 0.18, 0.47]
      position: [0.42, -0.08, 0.035]
    gold:
      type: cube
      size: [0.07, 0.07, 0.07]
      color: [0.86, 0.67, 0.16]
      position: [0.42, -0.22, 0.035]
    water:
      type: cube
      size: [0.11, 0.11, 0.08]
      color: [0.55, 0.78, 0.88]
      position: [0.30, 0.0, 0.04]

execute:
  task: |
    Dip the brush in each pot and lay a stroke on the canvas.
  behavior_tree: painter.bt.yml

assert:
  - robot.success
