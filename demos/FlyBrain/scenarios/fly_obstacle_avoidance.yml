# Reach the food while skirting the blocks.
# Lengths are metres of data/drosophila_x100.urdf (about 28 cm, 1 kg):
# the real fly is a hundred times smaller and a million times lighter.
scenario: fly_obstacle_avoidance

seed: 123456
dt: 0.01
horizon: 40
sensor_noise: 0.01
layout_jitter: 0.02

agent:
  type: fly_brain

environment:
  type: fly
  size: [10.0, 10.0, 5.0]

  fly:
    position: [0.5, 0.0, 1.0]
    orientation: [0.0, 0.0, 0.0]

  obstacles:
    - position: [3.2, 0.40, 1.0]
      size: [1.0, 1.3, 2.0]
    - position: [5.7, -0.45, 1.0]
      size: [0.8, 1.1, 3.0]

  target:
    position: [8.0, -1.5, 1.75]

robot:
  model: drosophila_x100.urdf
