scenario: joint_limits
seed: 1

robot:
  model: robot_6axis.urdf
  home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
  actuators:
    arm: { type: joint_group }

execute:
  task: |
    Command the shoulder toward its upper stop. The measured position stays
    inside the URDF limits.

assert:
  - limit.inside == 1
  - limit.reached == 1
  - time < 30
