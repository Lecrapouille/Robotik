scenario: inverse_kinematics
seed: 1

robot:
  model: robot_6axis.urdf
  home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
  actuators:
    arm: { type: joint_group }

execute:
  task: |
    Move the tool a few centimetres using inverse kinematics.
    The position error starts out of tolerance and becomes green without
    the assertion itself stopping the run.

assert:
  - ik.error < 0.02
  - time < 30
