scenario: pick_and_place_rl
seed: 42

robot:
  model: robot_6axis_vacuum.urdf
  home: { joint1: 0.0, joint2: 0.3, joint3: 1.3, joint4: 0.0, joint5: 1.54, joint6: 0.0 }
  sensors:
    wrist_camera:
      type: camera
      parent: link6
      position: [0.05, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      fov: 70
      resolution: [320, 240]
      frequency: 15
      noise: 0.01
  actuators:
    arm: { type: joint_group }
    gripper: { type: vacuum, length: 0.06 }

world:
  objects:
    red_cube:
      type: cube
      size: [0.04, 0.04, 0.04]
      color: [0.9, 0.1, 0.1]
      position: [0.40, 0.20, 0.02]
      randomize: { x: [-0.06, 0.06], y: [-0.06, 0.06] }
    box:
      type: box
      size: [0.16, 0.16, 0.08]
      color: [0.2, 0.4, 0.9]
      position: [0.40, -0.20, 0.04]

execute:
  task: |
    One rendered environment. The policy starts converged, or random and
    converts toward the recipe. The parallel pool stays in Robotik-PickAndPlaceRL.

assert:
  - time < 200
